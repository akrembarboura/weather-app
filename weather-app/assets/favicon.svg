<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Atmospheric Squircle Background -->
    <linearGradient id="atm-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Rim Highlight Gradient -->
    <linearGradient id="atm-rim" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Radiant Solar Core Gradient -->
    <radialGradient id="atm-sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 22) rotate(45) scale(14)">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>

    <!-- Telemetry Orbit Ring Gradient -->
    <linearGradient id="atm-orbit" x1="10" y1="42" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Frosted Cloud Gradient -->
    <linearGradient id="atm-cloud" x1="22" y1="24" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <filter id="atm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#atm-bg)"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="15.25" stroke="url(#atm-rim)" stroke-width="1.5"/>

  <!-- Subtle Isobar / Telemetry Orbit Arc (Back) -->
  <path d="M12 40C9.5 32 16.5 21 29 16.5C41.5 12 52 15.5 54 23" stroke="url(#atm-orbit)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.65"/>

  <!-- Solar Rays -->
  <g stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <line x1="24" y1="9.5" x2="24" y2="12.5"/>
    <line x1="14.2" y1="13.2" x2="16.4" y2="15.4"/>
    <line x1="10.5" y1="23" x2="13.5" y2="23"/>
    <line x1="33.8" y1="13.2" x2="31.6" y2="15.4"/>
  </g>

  <!-- Solar Orb -->
  <circle cx="24" cy="23" r="9.5" fill="url(#atm-sun)"/>

  <!-- Frosted Glass Cloud Layer -->
  <g filter="url(#atm-glow)">
    <path d="M23 44H43.5C47.9183 44 51.5 40.4183 51.5 36C51.5 31.9598 48.5048 28.6195 44.6143 28.0762C43.1332 22.8473 38.3237 19 32.6 19C25.9506 19 20.5177 24.192 20.1235 30.7429C16.6524 31.4256 14 34.4847 14 38.15C14 41.3809 16.6191 44 19.85 44H23Z" fill="url(#atm-cloud)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
  </g>

  <!-- Atmospheric Wind / Telemetry Wave Accent -->
  <path d="M18 50.5H36.5C38.7 50.5 40.5 48.9 40.5 47C40.5 45.2 39 43.8 37.2 43.8" stroke="url(#atm-orbit)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="45.5" cy="50.5" r="1.6" fill="#34d399"/>
</svg>
